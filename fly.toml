app = "revenue-assurance"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  BOOTSTRAP_DEMO_DATA = "false"
  INUKA_STREAM_SIMULATOR = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
