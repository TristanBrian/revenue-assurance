# render.yaml
services:
  # ============================================================================
  # BACKEND SERVICE (FastAPI + Python)
  # ============================================================================
  - type: web
    name: kpc-backend
    runtime: docker
    repo: https://github.com/TristanBrian/revenue-assurance.git
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health

    # ========================================================================
    # ENVIRONMENT VARIABLES
    # ========================================================================
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: PORT
        value: "10000"

      # KRA Integration
      - key: KRA_ICMS_ENDPOINT
        sync: false

      - key: KRA_ICMS_API_KEY
        sync: false

      # App config
      - key: APP_NAME
        value: Reconova

      - key: APP_TAGLINE
        value: Enterprise Intelligence System

      - key: APP_VERSION
        value: 2.0.0

      - key: MATERIALITY_THRESHOLD
        value: "100000"

      - key: CRITICAL_AGE_DAYS
        value: "60"

      - key: LOG_LEVEL
        value: INFO

      # ✅ CORS – allow your Vercel frontend
      - key: CORS_ORIGINS
        value: https://reconova.vercel.app
      - key: BOOTSTRAP_DEMO_DATA
        value: "false"
      - key: INUKA_STREAM_SIMULATOR
        value: "false"
