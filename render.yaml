# render.yaml
services:
  # ============================================================================
  # BACKEND SERVICE (FastAPI + Python)
  # ============================================================================
  - type: web
    name: kpc-backend
    runtime: docker
    repo: https://github.com/TristanBrian/revenue-assurance.git
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health

    # ========================================================================
    # ENVIRONMENT VARIABLES
    # ========================================================================
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: PORT
        value: "10000"

      # KRA Integration
      - key: KRA_ICMS_ENDPOINT
        value: https://api.kra.go.ke/icms/v2/invoices

      - key: KRA_ICMS_API_KEY
        generateValue: true

      # App config
      - key: MATERIALITY_THRESHOLD
        value: "100000"

      - key: CRITICAL_AGE_DAYS
        value: "60"

      - key: LOG_LEVEL
        value: INFO

      # ✅ CORS – allow your Vercel frontend
      - key: CORS_ORIGINS
        value: https://flowguardd.vercel.app,https://*.vercel.app,https://*.onrender.com