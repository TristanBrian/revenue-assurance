services:
  db:
    image: postgres:16
    container_name: kpc-db
    ports:
      # Not 5434 (taken by an unrelated project's container on this
      # machine) or 5433 (reserved for this project's own non-Docker
      # Postgres dev setup, per AUTH_NOTES.md) — 5437 is clear of both.
      - "5437:5432"
    environment:
      - POSTGRES_USER=kpc_app
      - POSTGRES_PASSWORD=kpc_local_dev
      - POSTGRES_DB=kpc_db
    volumes:
      - kpc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpc_app -d kpc_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - /app/__pycache__
      # Overlay host logs/ (often root-owned from earlier Docker runs) so
      # rootless Podman can write ETL logs instead of PermissionError-exiting.
      - /app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://kpc_app:kpc_local_dev@db:5432/kpc_db
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: /app/scripts/start.sh
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kpc-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Docker sets HOSTNAME to the container ID by default; Next's
      # standalone server.js binds to process.env.HOSTNAME and does a
      # DNS lookup on it, which fails (EAI_AGAIN) since the container
      # ID isn't a resolvable name. Force binding on all interfaces.
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    stdin_open: true
    tty: true

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=90d"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-reconova-local}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

volumes:
  kpc-db-data:
  prometheus-data:
  grafana-data:
