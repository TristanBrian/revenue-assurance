global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Configure a production receiver (email, Slack, PagerDuty, etc.) via
    # a secrets-managed deployment. Local development remains notification-safe.
