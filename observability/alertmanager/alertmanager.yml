global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /tmp/slack_webhook
        channel: "#reconovaa-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] Reconova alert"
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }} —
          {{ .Annotations.description }}{{ end }}
